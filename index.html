<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UW Bus Stops Tile Map</title>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    #menu {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      z-index: 1;
    }

    #menu strong {
      display: block;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

<div id="menu">
  <strong>Map Layers</strong>
  <label><input type="checkbox" checked onclick="toggleLayer('m1')"> Basemap</label><br>
  <label><input type="checkbox" onclick="toggleLayer('m2')"> Bus stops near campus</label><br>
  <label><input type="checkbox" onclick="toggleLayer('m3')"> Bus stops near campus</label><br>
  <label><input type="checkbox" onclick="toggleLayer('m4')"> UW theme</label>
</div>

<div id="map"></div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoieXVhbmZ3MiIsImEiOiJjbWlqZ3RqZG0wb21iM2Vwd2ViNTI0NXozIn0.ubgQRn7GzHQFL4W6LoQDQw';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [-122.306, 47.655], 
    minZoom: 10,
    maxZoom: 15,
    zoom: 14,
  });

  map.addControl(new mapboxgl.NavigationControl());
  map.addControl(new mapboxgl.ScaleControl());

  map.on('load', () => {

  map.addSource('m1', {
    type: 'raster',
    tiles: ['assets/tileset_1/{z}/{x}/{y}.png'],
    tileSize: 256,
    minzoom: 10,
    maxzoom: 15
  });
  map.addLayer({ id: 'm1', type: 'raster', source: 'm1', layout: { visibility: 'visible' } });

  map.addSource('m2', {
    type: 'raster',
    tiles: ['assets/tileset_2/{z}/{x}/{y}.png'],
    tileSize: 256,
    minzoom: 10,
    maxzoom: 15
  });
  map.addLayer({ id: 'm2', type: 'raster', source: 'm2', layout: { visibility: 'none' } });

  map.addSource('m3', {
    type: 'raster',
    tiles: ['assets/tileset_3/{z}/{x}/{y}.png'],
    tileSize: 256,
    minzoom: 10,
    maxzoom: 15
  });
  map.addLayer({ id: 'm3', type: 'raster', source: 'm3', layout: { visibility: 'none' } });

  map.addSource('m4', {
    type: 'raster',
    tiles: ['assets/tileset_4/{z}/{x}/{y}.png'],
    tileSize: 256,
    minzoom: 10,
    maxzoom: 15
  });
  map.addLayer({ id: 'm4', type: 'raster', source: 'm4', layout: { visibility: 'none' } });

});

  function toggleLayer(layerId) {
    const visibility = map.getLayoutProperty(layerId, 'visibility');
    map.setLayoutProperty(
      layerId,
      'visibility',
      visibility === 'visible' ? 'none' : 'visible'
    );
  }
</script>

</body>
</html>
